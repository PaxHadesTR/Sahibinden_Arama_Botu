services:
  # =========================================================================
  # CLOUDFLARE WARP SIDECAR (YÖNTEM B):
  # -------------------------------------------------------------------------
  # WSL veya sunucunuza hiçbir paket (warp-cli) kurmanıza gerek kalmaz.
  # Docker bu hafif konteyneri otomatik ayağa kaldırır ve 1080 portunda
  # SOCKS5 proxy sunar.
  # =========================================================================
  warp:
    image: caomingjun/warp
    container_name: sahibinden-warp
    restart: unless-stopped
    environment:
      - WARP_SLEEP=2

  sahibinden-bot:
    build: .
    container_name: sahibinden-discord-bot
    restart: unless-stopped
    shm_size: "1gb"
    depends_on:
      - warp
    env_file:
      - .env
    environment:
      # Linux konteynerinde Xvfb sanal ekranı üzerindeki varsayılan Chromium kullanılır
      - BROWSER_CHANNEL=
      - HEADLESS=false
      - PYTHONPATH=/app
      # WARP Sidecar ayarları
      - USE_WARP=true
      - WARP_HOST=warp
      - WARP_PORT=1080
    volumes:
      - bot_data:/app/data

volumes:
  bot_data:
    name: sahibinden_bot_data
