services:
  sahibinden-bot:
    build: .
    container_name: sahibinden-discord-bot
    restart: unless-stopped
    shm_size: "1gb"

    # =========================================================================
    # YÖNTEM A (WSL Host Cloudflare WARP):
    # -------------------------------------------------------------------------
    # Konteyner WSL ağ katmanını doğrudan paylaşır. Böylece WSL üzerinde koşan
    # warp-cli'a (socks5://127.0.0.1:40000) hiçbir köprü veya yönlendirme olmadan
    # doğrudan ve en yüksek performansla bağlanır.
    # =========================================================================
    network_mode: "host"

    env_file:
      - .env
    environment:
      # Linux konteynerinde Xvfb sanal ekranı üzerindeki varsayılan Chromium kullanılır
      - BROWSER_CHANNEL=
      - HEADLESS=false
      - PYTHONPATH=/app
    volumes:
      - bot_data:/app/data

volumes:
  bot_data:
    name: sahibinden_bot_data
